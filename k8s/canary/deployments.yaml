# Service selects label app=aceest-canary -> traffic split ~ replica ratio (3:1 = 75/25)
apiVersion: apps/v1
kind: Deployment
metadata: { name: aceest-stable }
spec:
  replicas: 3
  selector: { matchLabels: { app: aceest-canary, track: stable } }
  template:
    metadata: { labels: { app: aceest-canary, track: stable } }
    spec:
      containers:
        - name: app
          image: YOUR_DOCKERHUB_USER/aceest-fitness:1.0.0
          ports: [{ containerPort: 5000 }]
          readinessProbe: { httpGet: { path: /health, port: 5000 } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: aceest-canary }
spec:
  replicas: 1
  selector: { matchLabels: { app: aceest-canary, track: canary } }
  template:
    metadata: { labels: { app: aceest-canary, track: canary } }
    spec:
      containers:
        - name: app
          image: YOUR_DOCKERHUB_USER/aceest-fitness:1.1.0
          ports: [{ containerPort: 5000 }]
          readinessProbe: { httpGet: { path: /health, port: 5000 } }
---
apiVersion: v1
kind: Service
metadata: { name: aceest-canary-svc }
spec:
  type: NodePort
  selector: { app: aceest-canary }
  ports: [{ port: 80, targetPort: 5000 }]

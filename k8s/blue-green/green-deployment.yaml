apiVersion: apps/v1
kind: Deployment
metadata: { name: aceest-green }
spec:
  replicas: 2
  selector: { matchLabels: { app: aceest-bg, slot: green } }
  template:
    metadata: { labels: { app: aceest-bg, slot: green } }
    spec:
      containers:
        - name: app
          image: yamunahegade/aceest-fitness:1.1.0
          ports: [{ containerPort: 5000 }]
          readinessProbe: { httpGet: { path: /health, port: 5000 } }

# SHADOW DEPLOYMENT using the NGINX ingress (minikube addons enable ingress).
# Real traffic -> v1 (answers the caller). A mirrored copy of every request is
# sent to v2 (answer discarded), so v2 is tested with live traffic, zero user risk.
# Change the image tags to your Jenkins-built versions if they differ.
apiVersion: apps/v1
kind: Deployment
metadata: { name: aceest-v1 }
spec:
  replicas: 2
  selector: { matchLabels: { app: aceest-shadow, version: v1 } }
  template:
    metadata: { labels: { app: aceest-shadow, version: v1 } }
    spec:
      containers:
        - name: app
          image: yamunahegade/aceest-fitness:1.0.4
          ports: [{ containerPort: 5000 }]
          env: [{ name: GUNICORN_CMD_ARGS, value: "--access-logfile -" }]
          readinessProbe: { httpGet: { path: /health, port: 5000 } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: aceest-v2 }
spec:
  replicas: 1
  selector: { matchLabels: { app: aceest-shadow, version: v2 } }
  template:
    metadata: { labels: { app: aceest-shadow, version: v2 } }
    spec:
      containers:
        - name: app
          image: yamunahegade/aceest-fitness:1.0.5
          ports: [{ containerPort: 5000 }]
          env: [{ name: GUNICORN_CMD_ARGS, value: "--access-logfile -" }]
          readinessProbe: { httpGet: { path: /health, port: 5000 } }
---
apiVersion: v1
kind: Service
metadata: { name: aceest-v1-svc }
spec: { selector: { app: aceest-shadow, version: v1 }, ports: [{ port: 80, targetPort: 5000 }] }
---
apiVersion: v1
kind: Service
metadata: { name: aceest-v2-svc }
spec: { selector: { app: aceest-shadow, version: v2 }, ports: [{ port: 80, targetPort: 5000 }] }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-shadow
  annotations:
    nginx.ingress.kubernetes.io/mirror-target: "http://aceest-v2-svc.default.svc.cluster.local$request_uri"
    nginx.ingress.kubernetes.io/mirror-request-body: "on"
spec:
  ingressClassName: nginx
  rules:
    - host: shadow.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: aceest-v1-svc, port: { number: 80 } } }

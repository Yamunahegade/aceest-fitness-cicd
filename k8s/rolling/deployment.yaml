apiVersion: apps/v1
kind: Deployment
metadata: { name: aceest-rolling }
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }   # zero downtime
  selector: { matchLabels: { app: aceest-rolling } }
  template:
    metadata: { labels: { app: aceest-rolling } }
    spec:
      containers:
        - name: app
          image: yamunahegade/aceest-fitness:1.0.0
          ports: [{ containerPort: 5000 }]
          readinessProbe: { httpGet: { path: /health, port: 5000 }, initialDelaySeconds: 3, periodSeconds: 5 }
          livenessProbe:  { httpGet: { path: /health, port: 5000 }, initialDelaySeconds: 10, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: aceest-rolling-svc }
spec:
  type: NodePort
  selector: { app: aceest-rolling }
  ports: [{ port: 80, targetPort: 5000 }]
